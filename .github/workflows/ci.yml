name: CI

# Regenerate the synthetic scenario and run the test suite on a bare clone.
# Single Linux job, no optional embeddings extra — the sentence-transformers
# backend test skips without torch (matching the local 1-skipped baseline), so
# the suite stays fast and hermetic.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this job only reads the repo (checkout + test). Declared at
# workflow level so every job inherits the read-only token (F-019).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (a mutable tag can be
      # force-moved); the human-readable version is kept in the comment (F-019).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate synthetic scenario (deterministic; seeded)
        run: python scripts/generate_scenario.py

      - name: Run tests
        run: python -m pytest -q
